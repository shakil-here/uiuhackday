<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title><!DOCTYPE html>
<html>
<head>
    <title>Emotion AI</title>
    <style>
        .container { display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        #video { border: 2px solid #333; border-radius: 8px; }
        #result { margin-top: 20px; font-size: 24px; font-weight: bold; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Facial Emotion Predictor</h1>
        <video id="video" width="640" height="480" autoplay></video>
        <button id="capture" style="margin: 10px; padding: 10px 20px;">Detect Emotion</button>
        <div id="result">Result will appear here...</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const resultDiv = document.getElementById('result');

        // Access Webcam
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; });

        document.getElementById('capture').addEventListener('click', async () => {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // Convert canvas to Blob
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'face.jpg');

                resultDiv.innerText = "Analyzing...";

                // Send to FastAPI
                const response = await fetch('http://localhost:8000/predict-emotion', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if(data.success) {
                    resultDiv.innerText = `Emotion: ${data.dominant_emotion.toUpperCase()}`;
                } else {
                    resultDiv.innerText = "Error: " + data.error;
                }
            }, 'image/jpeg');
        });
    </script>
</body>
</html></title>
</head>
